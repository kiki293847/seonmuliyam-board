 const esc=value=>{const span=document.createElement('span');span.textContent=String(value??'');return span.innerHTML;};
 const link=(url,text)=>{const a=document.createElement('a');a.href=/^https?:\/\//i.test(url||'')?url:'#';a.target='_blank';a.rel='noopener noreferrer';a.textContent=text;return a.outerHTML;};
 function card(row){const best=(row.roles||[]).find(r=>r.id===row.best_role_id);const state=campaignState(row);const rec=state==='open'?row.recommendation:'none';return '<article class="job campaign '+(rec==='strong'?'':'verify')+'"><div class="rail"></div><div class="job-main"><div class="co">'+esc(row.company)+' <span class="tag">'+esc(labels[state])+'</span> <span class="tag">'+esc(labels[rec])+'</span>'+(row.stale?' <span class="flags">이전 수집 자료</span>':'')+'</div><h3 class="role">'+link(row.official_url||row.url,row.title)+'</h3><p class="reasons">'+esc(best?'추천 분야: '+best.title+' · '+(best.location||'근무지 미확인'):'모집 분야 상세 미확인')+'</p><p class="reasons">'+(row.reasons||[]).map(esc).join(' · ')+'</p><p class="flags">'+(row.flags||[]).map(esc).join(' · ')+'</p><div class="meta"><span>마감 '+esc(row.end_at?row.end_at.replace('T',' ').slice(0,16)+' KST':row.due||'미확인')+'</span><span>첫 발견 '+esc((row.first_seen_at||'').slice(0,10))+'</span></div><details class="campaign-roles"><summary>모집 분야·지원 조건 '+(row.roles||[]).length+'개 확인</summary>'+((row.roles||[]).map(r=>'<section class="campaign-role"><h4>'+esc(r.company||row.company)+' · '+esc(r.title)+'</h4><div class="tags"><span class="tag">'+esc(({direct:'직접 연관',adjacent:'전공 인접',none:'관련 분야 아님',unknown:'적합도 미확인'})[r.fit]||'적합도 미확인')+'</span><span class="tag">'+esc(labels[r.conditions]||'조건 미확인')+'</span><span class="tag">'+esc(r.location||'근무지 미확인')+'</span></div><p class="reasons">'+(r.reasons||[]).map(esc).join(' · ')+'</p><p class="flags">'+(r.flags||[]).map(esc).join(' · ')+'</p><pre class="role-evidence">'+esc(r.body||'')+'</pre>'+((r.evidence||[]).map(e=>link(e.url,'모집 분야 원문')).join(' · '))+'</section>').join('')||'<p>텍스트로 확인한 분야가 없습니다. '+link(row.url,'원문에서 모집 분야 확인')+'</p>')+'</details><p class="source-links">'+link(row.url,'수집 원문')+(row.official_url?' · '+link(row.official_url,'공식 지원 안내'):'')+'</p></div></article>';}
 const ids=['search','company','region','recommendation','detail','state'];
 for(const company of [...new Set(DATA.map(r=>r.company))].sort()){const option=document.createElement('option');option.value=company;option.textContent=company;document.getElementById('company').appendChild(option);}
 function render(){const filters=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));const rows=DATA.filter(r=>campaignMatchesFilters(r,filters));const sections=campaignSections(rows);const stats=campaignSections(DATA);
 document.getElementById('n-all').textContent=stats.all.length;document.getElementById('n-ok').textContent=stats.recommended.filter(r=>r.recommendation==='strong'&&!r.stale).length;document.getElementById('n-check').textContent=stats.recommended.filter(r=>r.recommendation==='review'||r.stale).length;document.getElementById('n-soon').textContent=stats.soon.length;document.getElementById('count').textContent='필터 결과 '+rows.length+'개 공채';
 const section=(id,title,data)=>'<section id="'+id+'"><h2 class="section-title">'+title+' · '+data.length+'개</h2>'+(data.map(card).join('')||'<div class="empty">해당하는 공채가 없습니다.</div>')+'</section>';
 document.getElementById('list').innerHTML=section('recommended','추천 공채',sections.recommended)+section('soon','14일 내 마감 공채',sections.soon)+section('all-campaigns',filters.state==='closed'?'마감 공채':'전체 대기업 공채',filters.state==='closed'||filters.state==='all'?rows:sections.all);
 }
 document.getElementById('notice').textContent=STATUS.status==='ok'?'새로 수집한 대기업 공채입니다.':STATUS.status==='failed'?'이번 공채 수집에 실패했습니다. 이전 자료는 재확인이 필요합니다.':'확인된 출처의 공채를 표시합니다. 일부 공식 목록·모집 분야는 아직 확인되지 않았습니다.';
 document.getElementById('coverage-summary').textContent='대상 기업집단 '+(STATUS.target_group_count||0)+'개 · 공채가 발견된 기업군 '+(STATUS.checked_group_count||0)+'개 · 분야 미확인 '+(STATUS.detail_unknown_count||0)+'개 · 마지막 성공 '+(STATUS.collected_at||'없음')+' · 이번 시도 '+(STATUS.attempted_at||'없음');
 document.getElementById('source-list').innerHTML=(STATUS.sources||[]).map(s=>'<div class="source-row"><b>'+esc(s.source)+'</b> · '+esc(s.status==='ok'?'목록 종료 확인':s.status==='partial'?'일부 목록 확인':'조회 미확인')+' · '+esc(s.coverage?.pages||0)+'페이지 / '+esc(s.coverage?.listed_count??s.raw_count??0)+'건 조회 · 공채 후보 '+esc(s.coverage?.candidate_count||0)+'개'+(s.errors?.length?'<div class="flags">'+s.errors.map(esc).join(' · ')+'</div>':'')+'</div>').join('');
 ids.forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));render();setInterval(render,60000);
}
</script></body></html>
