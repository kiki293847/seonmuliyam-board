<script>const TODAY="2026-10-09";"use strict";
const DATA=JSON.parse(document.getElementById("jobs").textContent);
const STATUS=JSON.parse(document.getElementById("status").textContent);
const view=document.body.dataset.view;
const PUBLIC_VIEW=document.body.dataset.public==="true";
document.querySelector('[data-nav="'+view+'"]').classList.add("active");
function esc(value){const el=document.createElement("span");el.textContent=String(value??"");return el.innerHTML;}
function safeUrl(value){return /^https?:\/\//i.test(value||"")?value:"#";}
function jobLink(row){const link=document.createElement("a");link.href=safeUrl(row.url);link.target="_blank";link.rel="noopener noreferrer";link.textContent=String(row.title??"");return link.outerHTML;}
function dueDays(row){if(!/^\d{4}-\d{2}-\d{2}$/.test(row.due||""))return null;return Math.round((Date.parse(row.due+"T00:00:00Z")-Date.parse(TODAY+"T00:00:00Z"))/86400000);}
function card(row){const dd=dueDays(row);const due=dd===null?(row.due_kind==="open"?"상시채용":"마감일 미확인"):(dd===0?"오늘 마감":"D-"+dd+" · "+row.due);
return '<article class="job '+(row.eligible?'':'verify')+'"><div class="rail"></div><div class="job-main"><div class="co">'+esc(row.company)+' · '+esc(row.record_type||'일반 공고')+' · '+(row.tier===1?'핵심 관련 직무':'인접 직무')+'</div><h2 class="role">'+jobLink(row)+'</h2><div class="meta"><span>'+esc(row.location||"근무지 미확인")+'</span><span>'+esc(row.career||"경력 조건 미확인")+'</span></div><div class="tags">'+(row.stacks||[]).map(s=>'<span class="tag">'+esc(s)+'</span>').join("")+'</div><div class="reasons">'+(row.reasons||[]).map(esc).join(" · ")+'</div>'+((row.flags||[]).length?'<div class="flags">'+row.flags.map(esc).join(" · ")+'</div>':'')+'</div><div class="job-side">'+(PUBLIC_VIEW?'':'<span class="score">우선순위 '+esc(row.score)+'</span>')+'<span class="due '+(dd!==null&&dd<=14?'soon':'')+'">'+esc(due)+'</span><span class="src">'+esc((row.sources||[row.source]).join(" · "))+'</span><span class="seen">첫 발견 '+esc((row.first_seen_at||"").slice(0,10))+'</span>'+(!row.eligible?'<span class="badges">지원 요건 확인</span>':'')+'</div></article>';}
document.getElementById("n-all").textContent=DATA.length;
document.getElementById("n-ok").textContent=DATA.filter(r=>r.eligible).length;
document.getElementById("n-check").textContent=DATA.filter(r=>!r.eligible).length;
document.getElementById("n-soon").textContent=DATA.filter(r=>{const d=dueDays(r);return d!==null&&d<=14&&d>=0;}).length;
const failed=(STATUS.sources||[]).filter(s=>s.status!=="ok");
document.getElementById("notice").textContent=failed.length?"일부 출처의 목록을 확인하지 못했습니다. 확인된 출처의 공고를 표시합니다.":"이번 수집에서 확인한 공고입니다. 원문에서 최종 지원 조건을 확인하세요.";
document.getElementById("source-list").innerHTML=(STATUS.sources||[]).map(s=>'<div class="source-row">'+esc(s.source)+' · '+(s.status==="ok"?"목록 확인":s.status==="partial"?"일부 목록 확인":"조회 실패")+' · '+esc(s.raw_count??0)+'건 조회</div>').join("");
const inputs=["search","region","eligibility","tier","sort"];
let selectedDay=null;let month=Number(TODAY.slice(5,7))-1;let year=Number(TODAY.slice(0,4));
function filtered(){const q=document.getElementById("search").value.toLowerCase();const region=document.getElementById("region").value;const eligibility=document.getElementById("eligibility").value;const tier=document.getElementById("tier").value;
return DATA.filter(r=>{if(q&&!JSON.stringify([r.company,r.title,r.stacks,r.body]).toLowerCase().includes(q))return false;if(region==="서울"&&!/서울|Seoul/i.test(r.location||""))return false;if(region==="대전"&&!/대전|Daejeon/i.test(r.location||""))return false;if(region==="unknown"&&!(PUBLIC_VIEW?!r.location||/미확인|미정|전국/.test(r.location):r.flags.some(f=>f.includes("근무지"))))return false;if(eligibility==="yes"&&!r.eligible)return false;if(eligibility==="no"&&r.eligible)return false;if(tier&&r.tier!==Number(tier))return false;return true;}).sort((a,b)=>{const order=PUBLIC_VIEW?a.rank-b.rank:b.score-a.score;return document.getElementById("sort").value==="due"?(dueDays(a)??99999)-(dueDays(b)??99999)||order:order;});}
function list(rows){return rows.length?rows.map(card).join(""):'<div class="empty">조건에 맞는 공고가 없습니다. 필터를 조정하거나 다음 수집 결과를 확인하세요.</div>';}
function monthGrid(rows){const start=new Date(year,month,1).getDay();const total=new Date(year,month+1,0).getDate();let out=["일","월","화","수","목","금","토"].map(d=>'<div class="weekday">'+d+'</div>').join("");for(let i=0;i<start;i++)out+='<div class="day blank"></div>';for(let day=1;day<=total;day++){const key=year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");const jobs=rows.filter(r=>r.due===key);out+='<button class="day '+(key===TODAY?'today ':'')+(key===selectedDay?'selected':'')+'" data-day="'+key+'"><b>'+day+'</b>'+(jobs.length?'<span class="day-count">'+jobs.length+'건 마감</span><span class="day-company">'+esc(jobs[0].company)+'</span>':'')+'</button>';}document.getElementById("calendar").innerHTML=out;document.getElementById("month-label").textContent=year+"년 "+(month+1)+"월";}
function render(){const rows=filtered();document.getElementById("count").textContent="필터 결과 "+rows.length+"건";
if(view==="calendar"){document.getElementById("calendar-controls").hidden=false;document.getElementById("calendar").hidden=false;monthGrid(rows);const chosen=selectedDay?rows.filter(r=>r.due===selectedDay):rows.filter(r=>dueDays(r)!==null).sort((a,b)=>dueDays(a)-dueDays(b));document.getElementById("list").innerHTML='<h2 class="section-title">'+(selectedDay?selectedDay+" 마감":"날짜별 마감 공고")+'</h2>'+list(chosen)+(selectedDay?'':'<h2 class="section-title">상시·마감일 미확인</h2>'+list(rows.filter(r=>dueDays(r)===null)));}
else{document.getElementById("list").innerHTML=list(rows);}}
inputs.forEach(id=>document.getElementById(id).addEventListener(id==="search"?"input":"change",render));
document.getElementById("calendar").addEventListener("click",e=>{const el=e.target.closest("[data-day]");if(el){selectedDay=selectedDay===el.dataset.day?null:el.dataset.day;render();}});
document.getElementById("prev").addEventListener("click",()=>{month--;if(month<0){year--;month=11;}selectedDay=null;render();});
document.getElementById("next").addEventListener("click",()=>{month++;if(month>11){year++;month=0;}selectedDay=null;render();});
render();
</script>
</body></html>
